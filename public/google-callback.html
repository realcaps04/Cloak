<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Signing in…</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #07080a;
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <p>Finishing Google sign-in…</p>
    <script>
      ;(function () {
        var params = new URLSearchParams(window.location.hash.replace(/^#/, ''))
        var idToken = params.get('id_token')
        var error = params.get('error')
        var target = window.opener || window.parent

        if (target && target !== window) {
          target.postMessage(
            {
              source: 'cloak-google-oauth',
              idToken: idToken || null,
              error: error || (idToken ? null : 'missing_token'),
            },
            window.location.origin,
          )
        }

        window.close()
        setTimeout(function () {
          document.body.innerHTML =
            '<p>You can close this window and return to Cloak.</p>'
        }, 400)
      })()
    </script>
  </body>
</html>
